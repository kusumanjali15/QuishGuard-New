<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formosa Demo Bank - Sign in</title></head>   <!-- the REAL IdP, on its OWN official origin :8000 -->
<body>
  <h1>Formosa Demo Bank</h1>
  <p style="color:#a00">LAB IdP PAGE - the identity provider's own login, served from the official
     origin (:8000). In real SSO the password is typed HERE, not on the relying app. Fake data only.</p>
  <form id="idp" method="post" action="http://127.0.0.1:8000/login">
    <input name="username" placeholder="Username">
    <input name="password" type="password" placeholder="Password">
    <button type="submit">Sign in</button>
  </form>
  <p id="result"></p>
  <script>
    // Post same-origin to the IdP; on success hand control back to the relying app.
    document.getElementById("idp").addEventListener("submit", async (e) => {
      e.preventDefault();
      const u = document.querySelector('input[name="username"]').value;
      const p = document.querySelector('input[name="password"]').value;
      const r = await fetch("http://127.0.0.1:8000/login", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "username=" + u + "&password=" + p,
      });
      document.getElementById("result").textContent = r.ok ? "Signed in - returning to app" : "Sign-in failed";
      const ret = new URLSearchParams(location.search).get("return");
      if (r.ok && ret) setTimeout(() => { location.href = ret; }, 150);
    });
  </script>
</body></html>
