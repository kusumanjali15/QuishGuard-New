<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bean Corner Cafe - Verify</title></head>
<body>
  <h1>Bean Corner Cafe</h1>
  <p style="color:#a00">LAB BENIGN PAGE - delayed OTP step, sent to our OWN server.</p>
  <div id="slot"><p>Loading...</p></div>

  <script>
    // Legitimate step-up: OTP appears late, but is verified on OUR OWN origin.
    setTimeout(() => {
      document.getElementById("slot").innerHTML =
        '<input autocomplete="one-time-code" placeholder="Member code">' +
        '<button type="button" id="verify">Verify</button>';
      document.getElementById("verify").addEventListener("click", () => {
        const code = document.querySelector('input[autocomplete="one-time-code"]').value;
        fetch("http://127.0.0.1:8003/verify", {
          method: "POST",
          headers: {"Content-Type": "application/x-www-form-urlencoded"},
          body: "otp=" + encodeURIComponent(code),
        });
      });
    }, 2500);
  </script>
</body></html>
