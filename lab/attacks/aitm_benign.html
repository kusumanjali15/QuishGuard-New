<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bean Corner Cafe - Member sign-in</title></head>
<body>
  <h1>Bean Corner Cafe</h1>
  <p style="color:#a00">LAB BENIGN PAGE - legitimate login posting to OUR OWN origin (counterpart to the AiTM page).</p>
  <input name="username" placeholder="Member name">
  <input name="password" type="password" placeholder="Password">
  <button type="button" id="signin">Sign in</button>
  <script>
    document.getElementById("signin").addEventListener("click", () => {
      const p = document.querySelector('input[name="password"]').value;
      fetch("http://127.0.0.1:8003/login", {              // same-origin, legitimate
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "password=" + encodeURIComponent(p),
      });
    });
  </script>
</body></html>
